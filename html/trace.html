<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登记修订记录</title>
    <link rel="stylesheet" href="../css/harrow.css" />
    <script defer src="../js/data.js"></script>
    <script defer src="../js/journey-store.js"></script>
    <script defer src="../js/harrow.js"></script>
  </head>
  <body data-page="trace">
    <header>
      <strong>找回网 / 旧版修订记录</strong>
      <nav>
        <a href="index.html">找回网首页</a
        ><a href="index.html#mine">我的已收集材料</a>
      </nav>
    </header>
    <main>
      <p class="crumb">登记 0001 / 修订记录 / 原始附件</p>
      <h1>这不是一份完整的拾物登记</h1>
      <div id="trace-record"></div>
      <section>
        <h2>归还包 · 附件 01</h2>
        <p>扫描件未作文字识别。请自行核对工牌上的姓名、班次和编号。</p>
        <a href="../assets/danny-badge.svg" target="_blank" rel="noopener"
          ><img
            src="../assets/danny-badge.svg"
            class="evidence-image"
            alt="Danny 的旧工牌，点击放大查看" /></a
        ><button data-collect="badge">把工牌图收进我的</button>
      </section>
      <section>
        <h2>归还包 · 附件 02</h2>
        <button data-open="receipt">拆开首班值勤启用回执</button>
      </section>
      <section>
        <h2>附件中保留的网址</h2>
        <a href="harrow-login.html">Harrow House 馆务员工站 &gt;&gt;</a>
        <p>此站属于美术馆。工牌号、馆务账号和找回网客服号各自独立。</p>
      </section>
      <noscript>需要启用 JavaScript 才能保存材料和进行本机剧情验证。</noscript>
    </main>
    <footer>资料仅供本机查阅 · 不发送个人信息</footer>
    <p id="page-status" role="status"></p>
    <dialog id="file-dialog" aria-labelledby="file-title">
      <button id="close-file" aria-label="关闭材料">×</button>
      <div id="file-content"></div>
    </dialog>
  </body>
</html>
