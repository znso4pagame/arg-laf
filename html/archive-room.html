<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>5003 / 归档室</title>
    <link rel="stylesheet" href="../css/harrow.css" />
    <script defer src="../js/data.js"></script>
    <script defer src="../js/journey-store.js"></script>
    <script defer src="../js/harrow.js"></script>
  </head>
  <body data-page="archive">
    <header>
      <strong>ARCHIVE TERMINAL / 旧档案柜</strong>
      <nav>
        <a href="index.html">找回网首页</a
        ><a href="index.html#mine">我的已收集材料</a>
      </nav>
    </header>
    <main>
      <div id="archive-locked" hidden>
        <h1>尚未调取档案柜</h1>
        <p>请先在员工工作台定位档案柜，并保持员工会话。</p>
        <a href="harrow-desk.html">回员工工作台</a>
      </div>
      <div id="archive-content" hidden>
        <p class="crumb">5003 / ACCESS LOG: VISITOR UNREGISTERED</p>
        <h1>归档室 · 原件与副本</h1>
        <p>同一项目留下两份处理记录。先确认哪些字段发生了变化。</p>
        <div class="comparison-columns">
          <article id="document-a"></article>
          <article id="document-b"></article>
        </div>
        <form id="difference-form">
          <fieldset>
            <legend>标出所有发生变化的字段</legend>
            <label class="check"
              ><input type="checkbox" name="difference" value="name" />
              姓名</label
            ><label class="check"
              ><input type="checkbox" name="difference" value="project" />
              项目编号</label
            ><label class="check"
              ><input type="checkbox" name="difference" value="state" />
              结案状态</label
            ><label class="check"
              ><input type="checkbox" name="difference" value="department" />
              处理部门</label
            >
          </fieldset>
          <button>核对差异</button>
        </form>
        <p id="difference-status" role="status"></p>
        <section>
          <h2>关联凭据</h2>
          <div class="file-grid">
            <button data-open="signed">历史签收凭据 / 0002</button
            ><button data-open="relist">后续物品登记 / 0003</button
            ><button data-open="clause" id="clause-button" disabled>
              特殊认领附则 / 待差异核对
            </button>
          </div>
        </section>
        <section>
          <h2>人工证据关联</h2>
          <p>材料的存在不代表结论成立。请选择同一条记录关系中的三个字段。</p>
          <form id="chain-form">
            <label
              >0002 中的签收人<select name="signer" required>
                <option value="">请选择</option>
                <option>Q-17</option>
                <option>Danny</option>
                <option>Elias Rook</option>
              </select></label
            ><label
              >0003 中的物品名称<select name="subject" required>
                <option value="">请选择</option>
                <option>旧工牌</option>
                <option>Q-17</option>
                <option>小鹿</option>
              </select></label
            ><label
              >特殊认领一并移交的事项<select name="inheritance" required>
                <option value="">请选择</option>
                <option>工牌保管权</option>
                <option>失物所有权</option>
                <option>岗位职责</option>
              </select></label
            ><button>核验归档关系</button>
          </form>
          <p id="chain-status" role="status"></p>
          <div id="truth-result" hidden></div>
        </section>
        <a class="return-application" href="index.html#application"
          >回找回网，查看待决定的人员认领 &gt;&gt;</a
        >
      </div>
      <div id="archive-transition" hidden aria-hidden="true">
        当前访问者未登记<br /><small>旧系统正在恢复记录……</small>
      </div>
      <noscript>需要启用 JavaScript 才能保存材料和进行本机剧情验证。</noscript>
    </main>
    <footer>资料仅供本机查阅 · 不发送个人信息</footer>
    <p id="page-status" role="status"></p>
    <dialog id="file-dialog" aria-labelledby="file-title">
      <button id="close-file" aria-label="关闭材料">×</button>
      <div id="file-content"></div>
    </dialog>
  </body>
</html>
