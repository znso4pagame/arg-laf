<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title"><title id="title">照片背面：正式上岗的第一晚，十一月三日</title><rect width="900" height="620" fill="#e8dfc9"/><rect x="25" y="25" width="850" height="570" fill="none" stroke="#c8bea3"/><g transform="rotate(-4 450 310)" fill="#48515a" font-family="Georgia,'Songti SC',serif"><text x="125" y="185" font-size="32">正式上岗的第一晚。</text><text id="first-night-date" x="140" y="290" font-size="62">11 / 03</text><text x="125" y="365" font-size="25">不是试班，也不是上传照片那天。</text><text x="640" y="455" font-size="38">D.</text></g><text x="50" y="565" font-family="monospace" font-size="15" fill="#9d957f">02 / VERSO · 原稿背面</text><path d="M700 80l100 20-20 55-100-20z" fill="#d6c9aa" opacity=".6"/></svg>
